name: Build SongHub EHDZ Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SongHub_Android_Project_EHDZ.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "SongHub_Android_Project_EHDZ.zip" ]; then
            echo "::error::SongHub_Android_Project_EHDZ.zip not found in repository root."
            exit 1
          fi

          echo "PROJECT_ZIP=SongHub_Android_Project_EHDZ.zip" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          unzip -oq "$PROJECT_ZIP" -d extracted

          PROJECT_DIR="extracted/SongHub_Android_Project"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/www/app.js" ]; then
            echo "::error::SongHub app.js not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/www/splash-screen.png" ]; then
            echo "::error::Loading screen image not found."
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project files verified."

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build SongHub debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            -p "$ANDROID_PROJECT_DIR" \
            clean \
            assembleDebug \
            --no-daemon

          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK build finished but app-debug.apk was not found."
            exit 1
          fi

          ls -lh "$APK"
          echo "SongHub APK built successfully."

      - name: Upload SongHub APK
        uses: actions/upload-artifact@v4
        with:
          name: SongHub-EHDZ-Android-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
