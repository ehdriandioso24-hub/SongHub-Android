name: Build Songbook for SongHub Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SongHub_Android_Project.zip'
      - 'assets/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required files
        run: |
          test -f SongHub_Android_Project.zip
          test -f assets/songbook_icon.jpg
          test -f assets/Songbook_splash.png

      - name: Extract SongHub project
        run: |
          unzip -q SongHub_Android_Project.zip -d .
          echo "Top-level files after extraction:"
          find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -print

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS_FILE="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found after extracting the ZIP."
            echo "Check that SongHub_Android_Project.zip contains the complete Android/Gradle project."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"
          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: No app/build.gradle or app/build.gradle.kts found under $PROJECT_DIR"
            find "$PROJECT_DIR" -maxdepth 4 -type f \( -name build.gradle -o -name build.gradle.kts \) -print
            exit 1
          fi

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Install image conversion dependency
        run: python3 -m pip install --user Pillow

      - name: Configure app name, splash theme, and icons
        shell: bash
        run: |
          set -euo pipefail
          APP="$ANDROID_PROJECT_DIR/app"
          RES="$APP/src/main/res"
          MANIFEST="$APP/src/main/AndroidManifest.xml"
          GRADLE="$APP/build.gradle"
          KTS="$APP/build.gradle.kts"

          mkdir -p "$RES/values" "$RES/drawable" "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi"

          cat > "$RES/values/strings.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Songbook for SongHub</string>
          </resources>
          EOF

          # Add AndroidX SplashScreen dependency once.
          if [ -f "$GRADLE" ]; then
            if ! grep -q "androidx.core:core-splashscreen" "$GRADLE"; then
              python3 - <<'PY'
          from pathlib import Path
          p = Path(__import__("os").environ["ANDROID_PROJECT_DIR"]) / "app/build.gradle"
          s = p.read_text()
          if "dependencies {" not in s:
              raise SystemExit("Could not find dependencies { } in app/build.gradle")
          s = s.replace("dependencies {", "dependencies {\n    implementation 'androidx.core:core-splashscreen:1.0.1'", 1)
          p.write_text(s)
          PY
            fi
          elif [ -f "$KTS" ]; then
            if ! grep -q "androidx.core:core-splashscreen" "$KTS"; then
              python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["ANDROID_PROJECT_DIR"]) / "app/build.gradle.kts"
          s = p.read_text()
          if "dependencies {" not in s:
              raise SystemExit("Could not find dependencies { } in app/build.gradle.kts")
          s = s.replace("dependencies {", 'dependencies {\n    implementation("androidx.core:core-splashscreen:1.0.1")', 1)
          p.write_text(s)
          PY
            fi
          fi

          # Copy splash artwork. Android's native splash displays this as a centered icon.
          cp assets/Songbook_splash.png "$RES/drawable/songbook_splash.png"

          # Convert the JPG logo to PNG for Android adaptive icon foreground.
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os
          res = Path(os.environ["ANDROID_PROJECT_DIR"]) / "app/src/main/res"
          with Image.open("assets/songbook_icon.jpg") as im:
              im.convert("RGBA").save(res / "drawable/songbook_icon_foreground.png", "PNG")
          PY

          cat > "$RES/drawable/songbook_icon_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#FFFFFF"/>
          </shape>
          EOF

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/songbook_icon_background"/>
              <foreground android:drawable="@drawable/songbook_icon_foreground"/>
          </adaptive-icon>
          EOF

          # Generate legacy launcher icons at standard Android density sizes.
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os
          res = Path(os.environ["ANDROID_PROJECT_DIR"]) / "app/src/main/res"
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          with Image.open("assets/songbook_icon.jpg") as source:
              image = source.convert("RGBA")
              for folder, size in sizes.items():
                  image.resize((size, size), Image.Resampling.LANCZOS).save(
                      res / folder / "ic_launcher.png", "PNG"
                  )
          PY

          # Apply app name, launcher icons, and splash theme to the existing manifest.
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path(os.environ["ANDROID_PROJECT_DIR"]) / "app/src/main/AndroidManifest.xml"
          if not p.exists():
              raise SystemExit(f"Manifest not found: {p}")
          s = p.read_text()
          match = re.search(r"<application\b[^>]*>", s, flags=re.S)
          if not match:
              raise SystemExit("Could not find <application> tag in AndroidManifest.xml")
          tag = match.group(0)
          def set_attr(tag, name, value):
              pattern = rf'\s+{re.escape(name)}="[^"]*"'
              if re.search(pattern, tag):
                  return re.sub(pattern, f'\n        {name}="{value}"', tag, count=1)
              return tag[:-1] + f'\n        {name}="{value}">'
          for name, value in (
              ("android:label", "@string/app_name"),
              ("android:icon", "@mipmap/ic_launcher"),
              ("android:roundIcon", "@mipmap/ic_launcher"),
              ("android:theme", "@style/Theme.SongHub"),
          ):
              tag = set_attr(tag, name, value)
          p.write_text(s[:match.start()] + tag + s[match.end():])
          PY

          cat > "$RES/values/themes.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SongHub" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#000000</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/songbook_splash</item>
                  <item name="postSplashScreenTheme">@style/Theme.SongHub.Main</item>
              </style>
              <style name="Theme.SongHub.Main" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      - name: Build debug APK
        run: gradle -p "$ANDROID_PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Songbook-for-SongHub-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
