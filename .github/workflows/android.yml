name: Build Songbook for SongHub Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SongHub_Cyberpunk_Search_AZ_Title_Artist_Number.zip'
      - 'assets/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail

          test -f SongHub_Cyberpunk_Search_AZ_Title_Artist_Number.zip
          test -f assets/songbook_icon.jpg
          test -f assets/Songbook_splash.png

          echo "All required files found."

      - name: Extract updated SongHub project
        shell: bash
        run: |
          set -euo pipefail

          unzip -q SongHub_Cyberpunk_Search_AZ_Title_Artist_Number.zip -d .

          echo "Updated SongHub project extracted."

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle or app/build.gradle.kts is missing."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle-8.9-bin.zip

          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp

          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Install Pillow
        run: python3 -m pip install --user Pillow

      - name: Configure app name, splash and icons
        shell: bash
        run: |
          set -euo pipefail

          APP="$ANDROID_PROJECT_DIR/app"
          RES="$APP/src/main/res"

          mkdir -p \
            "$RES/values" \
            "$RES/drawable" \
            "$RES/mipmap-anydpi-v26" \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          cat > "$RES/values/strings.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Songbook for SongHub</string>
          </resources>
          EOF

          cp assets/Songbook_splash.png \
            "$RES/drawable/songbook_splash.png"

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import os

          res = Path(os.environ["ANDROID_PROJECT_DIR"]) / "app/src/main/res"

          with Image.open("assets/songbook_icon.jpg") as im:
              im.convert("RGBA").save(
                  res / "drawable/songbook_icon_foreground.png",
                  "PNG"
              )

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          with Image.open("assets/songbook_icon.jpg") as source:
              image = source.convert("RGBA")

              for folder, size in sizes.items():
                  image.resize(
                      (size, size),
                      Image.Resampling.LANCZOS
                  ).save(
                      res / folder / "ic_launcher.png",
                      "PNG"
                  )
          PY

          cat > "$RES/drawable/songbook_icon_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#FFFFFF"/>
          </shape>
          EOF

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/songbook_icon_background"/>
              <foreground android:drawable="@drawable/songbook_icon_foreground"/>
          </adaptive-icon>
          EOF

      - name: Configure splash screen dependency
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          app = Path(os.environ["ANDROID_PROJECT_DIR"]) / "app"

          candidates = [
              app / "build.gradle",
              app / "build.gradle.kts"
          ]

          gradle = next(
              (p for p in candidates if p.exists()),
              None
          )

          if gradle is None:
              raise SystemExit(
                  "No app/build.gradle or app/build.gradle.kts found."
              )

          text = gradle.read_text()

          if "androidx.core:core-splashscreen" not in text:

              match = re.search(
                  r"dependencies\s*\{",
                  text
              )

              if not match:
                  raise SystemExit(
                      f"Could not find dependencies block in {gradle}"
                  )

              if gradle.name.endswith(".kts"):
                  dependency = (
                      '\n    implementation'
                      '("androidx.core:core-splashscreen:1.0.1")\n'
                  )
              else:
                  dependency = (
                      "\n    implementation "
                      "'androidx.core:core-splashscreen:1.0.1'\n"
                  )

              text = (
                  text[:match.end()] +
                  dependency +
                  text[match.end():]
              )

              gradle.write_text(text)

          print("SplashScreen dependency configured.")
          PY

      - name: Configure Android theme
        shell: bash
        run: |
          set -euo pipefail

          RES="$ANDROID_PROJECT_DIR/app/src/main/res"

          cat > "$RES/values/themes.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="Theme.SongHub"
                  parent="Theme.SplashScreen">

                  <item name="windowSplashScreenBackground">#000000</item>

                  <item name="windowSplashScreenAnimatedIcon">
                      @drawable/songbook_splash
                  </item>

                  <item name="postSplashScreenTheme">
                      @style/Theme.SongHub.Main
                  </item>

              </style>

              <style name="Theme.SongHub.Main"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

      - name: Configure Android Manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          p = (
              Path(os.environ["ANDROID_PROJECT_DIR"])
              / "app/src/main/AndroidManifest.xml"
          )

          text = p.read_text()

          match = re.search(
              r"<application\b[^>]*>",
              text,
              flags=re.S
          )

          if not match:
              raise SystemExit(
                  "Could not find <application>."
              )

          tag = match.group(0)

          attributes = {
              "android:label": "@string/app_name",
              "android:icon": "@mipmap/ic_launcher",
              "android:roundIcon": "@mipmap/ic_launcher",
              "android:theme": "@style/Theme.SongHub",
          }

          for name, value in attributes.items():

              pattern = rf'\s+{re.escape(name)}="[^"]*"'

              if re.search(pattern, tag):

                  tag = re.sub(
                      pattern,
                      f'\n        {name}="{value}"',
                      tag,
                      count=1
                  )

              else:

                  tag = (
                      tag[:-1] +
                      f'\n        {name}="{value}">'
                  )

          p.write_text(
              text[:match.start()] +
              tag +
              text[match.end():]
          )

          print("AndroidManifest configured.")
          PY

      - name: Verify updated search project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project files..."

          find "$ANDROID_PROJECT_DIR" \
            -type f \
            \( -name "*.html" \
               -o -name "*.js" \
               -o -name "*.css" \
               -o -name "*.kt" \
               -o -name "*.java" \) \
            -print | head -100

          echo ""
          echo "Searching for Title / Artist / Number / A-Z functionality..."

          grep -RniE \
            "title|artist|song.?number|alphabet|A-Z|A–Z|letter" \
            "$ANDROID_PROJECT_DIR" \
            --exclude-dir=.gradle \
            --exclude-dir=build \
            | head -100 || true

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            -p "$ANDROID_PROJECT_DIR" \
            clean \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Songbook-for-SongHub-APK-AZ-Title-Artist-Number
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
