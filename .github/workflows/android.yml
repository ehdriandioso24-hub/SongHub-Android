name: Build Songbook for SongHub Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SongHub_Android_Project_EHDZ.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "SongHub_Android_Project_EHDZ.zip" ]; then
            echo "::error::SongHub_Android_Project_EHDZ.zip not found."
            exit 1
          fi

          echo "PROJECT_ZIP=SongHub_Android_Project_EHDZ.zip" >> "$GITHUB_ENV"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -oq "$PROJECT_ZIP" -d extracted

          PROJECT_DIR="extracted/SongHub_Android_Project"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "::error::settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/src/main/assets/www/app.js" ]; then
            echo "::error::SongHub app.js not found."
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project verified."
          echo "Project directory: $PROJECT_DIR"

      - name: Change Android app name
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST=$(find "$ANDROID_PROJECT_DIR/app/src/main" \
            -type f \
            -name "AndroidManifest.xml" \
            -print -quit)

          if [ -z "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          echo "Manifest found:"
          echo "$MANIFEST"

          python3 - "$MANIFEST" <<'PY'
          import re
          import sys

          manifest = sys.argv[1]
          new_name = "Songbook for SongHub"

          with open(manifest, "r", encoding="utf-8") as f:
              text = f.read()

          # Change every existing android:label
          text = re.sub(
              r'android:label\s*=\s*("[^"]*"|\'[^\']*\')',
              'android:label="Songbook for SongHub"',
              text
          )

          # If there was no android:label, add one to <application>
          if 'android:label=' not in text:
              text = re.sub(
                  r'<application\b',
                  '<application android:label="Songbook for SongHub"',
                  text,
                  count=1
              )

          with open(manifest, "w", encoding="utf-8") as f:
              f.write(text)

          print("App name changed to: Songbook for SongHub")
          PY

          echo "Updated manifest:"
          grep -n "android:label" "$MANIFEST" || true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_DIR="$RUNNER_TEMP/songbook-keystore"
          mkdir -p "$KEYSTORE_DIR"

          KEYSTORE_FILE="$KEYSTORE_DIR/songhub-release.keystore"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Keystore file is empty."
            exit 1
          fi

          echo "KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

          echo "Android keystore prepared successfully."

      - name: Build Songbook Release APK
        shell: bash
        run: |
          set -euo pipefail

          echo "Building RELEASE APK..."

          gradle \
            -p "$ANDROID_PROJECT_DIR" \
            clean \
            assembleRelease \
            --no-daemon

          RELEASE_DIR="$ANDROID_PROJECT_DIR/app/build/outputs/apk/release"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "::error::Release APK directory not found."
            exit 1
          fi

          echo "Release files:"
          find "$RELEASE_DIR" -maxdepth 1 -type f -print

          INPUT_APK=$(find "$RELEASE_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print \
            | head -n 1)

          if [ -z "$INPUT_APK" ]; then
            echo "::error::No Release APK was produced."
            exit 1
          fi

          echo "Release APK found:"
          echo "$INPUT_APK"

          echo "INPUT_APK=$INPUT_APK" >> "$GITHUB_ENV"

      - name: Sign Release APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK location not found."
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$SDK_ROOT/build-tools" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::Android Build Tools not found."
            exit 1
          fi

          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          if [ ! -f "$ZIPALIGN" ]; then
            echo "::error::zipalign not found."
            exit 1
          fi

          if [ ! -f "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          RELEASE_DIR="$ANDROID_PROJECT_DIR/app/build/outputs/apk/release"

          ALIGNED_APK="$RELEASE_DIR/songbook-aligned.apk"
          FINAL_APK="$RELEASE_DIR/Songbook-for-SongHub-release.apk"

          echo "Using Build Tools:"
          echo "$BUILD_TOOLS_DIR"

          echo "Zipaligning APK..."

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$INPUT_APK" \
            "$ALIGNED_APK"

          echo "Signing APK..."

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEYSTORE_KEY_PASSWORD" \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            "$FINAL_APK"

          echo "Signed APK created successfully."

          ls -lh "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

      - name: Upload Songbook Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Songbook-for-SongHub-Release-APK
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 14
