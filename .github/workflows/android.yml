name: Build Songbook for SongHub Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SongHub_Android_Project.zip'
      - 'assets/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract SongHub project
        run: |
          unzip -q SongHub_Android_Project.zip -d .

      - name: Set app name
        run: |
          mkdir -p SongHub_Android_Project/app/src/main/res/values

          cat > SongHub_Android_Project/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Songbook for SongHub</string>
          </resources>
          EOF

      - name: Install app icon and splash screen
        run: |
          RES="SongHub_Android_Project/app/src/main/res"

          mkdir -p "$RES/drawable"
          mkdir -p "$RES/mipmap-hdpi"
          mkdir -p "$RES/mipmap-mdpi"
          mkdir -p "$RES/mipmap-xhdpi"
          mkdir -p "$RES/mipmap-xxhdpi"
          mkdir -p "$RES/mipmap-xxxhdpi"

          # Image 1 - Songbook logo / app icon
          cp assets/songbook_icon.jpg "$RES/drawable/songbook_icon.jpg"

          # Image 2 - Loading / splash screen
          cp assets/songbook_splash.png "$RES/drawable/songbook_splash.png"

          # Create adaptive icon background
          cat > "$RES/drawable/songbook_icon_background.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#FFFFFF"/>
          </shape>
          EOF

          # Create adaptive icon
          mkdir -p "$RES/mipmap-anydpi-v26"

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/songbook_icon_background"/>
              <foreground android:drawable="@drawable/songbook_icon_foreground"/>
          </adaptive-icon>
          EOF

          # Copy logo as foreground
          cp assets/songbook_icon.jpg "$RES/drawable/songbook_icon_foreground.jpg"

          # Legacy launcher icon
          cp assets/songbook_icon.jpg "$RES/mipmap-mdpi/ic_launcher.jpg"
          cp assets/songbook_icon.jpg "$RES/mipmap-hdpi/ic_launcher.jpg"
          cp assets/songbook_icon.jpg "$RES/mipmap-xhdpi/ic_launcher.jpg"
          cp assets/songbook_icon.jpg "$RES/mipmap-xxhdpi/ic_launcher.jpg"
          cp assets/songbook_icon.jpg "$RES/mipmap-xxxhdpi/ic_launcher.jpg"

      - name: Configure Android Manifest
        run: |
          MANIFEST="SongHub_Android_Project/app/src/main/AndroidManifest.xml"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("SongHub_Android_Project/app/src/main/AndroidManifest.xml")

          if path.exists():
              text = path.read_text()

              text = text.replace(
                  'android:label="@string/app_name"',
                  'android:label="@string/app_name"'
              )

              if 'android:icon=' not in text:
                  text = text.replace(
                      '<application',
                      '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher"'
                  )

              path.write_text(text)
          PY

      - name: Build debug APK
        run: |
          gradle -p SongHub_Android_Project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Songbook-for-SongHub-APK
          path: SongHub_Android_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
