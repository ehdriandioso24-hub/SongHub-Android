name: Build SongHub Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SongHub_Android_Project_EHDZ.zip'
      - 'SongHub_Cyberpunk_Search_AZ_Title_Artist_Number_Updated.zip'
      - 'SongHub_Cyberpunk_Search_AZ_Title_Artist_Number.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find SongHub project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f SongHub_Android_Project_EHDZ.zip ]; then
            echo "PROJECT_ZIP=SongHub_Android_Project_EHDZ.zip" >> "$GITHUB_ENV"
          elif [ -f SongHub_Cyberpunk_Search_AZ_Title_Artist_Number_Updated.zip ]; then
            echo "PROJECT_ZIP=SongHub_Cyberpunk_Search_AZ_Title_Artist_Number_Updated.zip" >> "$GITHUB_ENV"
          elif [ -f SongHub_Cyberpunk_Search_AZ_Title_Artist_Number.zip ]; then
            echo "PROJECT_ZIP=SongHub_Cyberpunk_Search_AZ_Title_Artist_Number.zip" >> "$GITHUB_ENV"
          else
            echo "::error::SongHub project ZIP not found in repository root."
            exit 1
          fi

          echo "Selected project ZIP."

      - name: Extract SongHub project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          unzip -oq "$PROJECT_ZIP" -d extracted

          SETTINGS_FILE="$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::App Gradle file was not found."
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify SongHub assets
        shell: bash
        run: |
          set -euo pipefail

          WEB="$ANDROID_PROJECT_DIR/app/src/main/assets/www"

          test -f "$WEB/index.html"
          test -f "$WEB/app.js"
          test -f "$WEB/songs-data.js"
          test -f "$WEB/splash-screen.png"

          echo "SongHub web assets verified."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            -p "$ANDROID_PROJECT_DIR" \
            clean \
            assembleDebug \
            --no-daemon

          APK="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK build completed."

      - name: Upload SongHub APK
        uses: actions/upload-artifact@v4
        with:
          name: SongHub-EHDZ-Android-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
